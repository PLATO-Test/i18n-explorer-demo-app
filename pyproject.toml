[project]
name = "northstar-bank-poc"
version = "0.1.0"
description = "Bilingual (en / fr-CA) demo bank app with seeded i18n defects for an AI i18n-testing POC"
requires-python = ">=3.14,<3.15"
dependencies = [
    "flask>=3.0,<4",
    "babel>=2.14,<3",
    "tzdata>=2024.1",
    "pillow>=11.3,<12",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "requests>=2.31,<3",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webapp"]
