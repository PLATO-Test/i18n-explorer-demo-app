<!DOCTYPE html>
<html lang="{{ html_lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }} — {{ t('common.bank_name') }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="alternate" hreflang="en" href="{{ alt_url('en') }}">
<link rel="alternate" hreflang="fr-CA" href="{{ alt_url('fr') }}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ url_for('landing.index', lang=locale) }}" data-testid="header-brand">{{ t('common.bank_name') }}</a>
  <nav class="site-nav">
    <a href="{{ url_for('dashboard.index', lang=locale) }}" data-testid="header-dashboard-link">{{ t('dashboard.title') }}</a>
    <a href="#" data-testid="header-signin-link">{{ t('header.sign_in') }}</a>
    <a href="{{ alt_url(other_locale) }}" data-testid="lang-switch-link">{{ 'Français' if locale == 'en' else 'English' }}</a>
  </nav>
</header>
<main class="site-main">
{% block content %}{% endblock %}
</main>
</body>
</html>
