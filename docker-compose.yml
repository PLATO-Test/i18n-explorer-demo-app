services:
  clean:
    build: .
    ports:
      - "5001:5000"
    environment:
      SEEDED_DEFECTS: "0"
      APP_TODAY: "2026-09-16"
      TZ: "America/Toronto"
      SECRET_KEY: "poc-clean-secret-key"

  seeded:
    build: .
    ports:
      - "5002:5000"
    environment:
      SEEDED_DEFECTS: "1"
      APP_TODAY: "2026-09-16"
      TZ: "America/Toronto"
      SECRET_KEY: "poc-seeded-secret-key"
